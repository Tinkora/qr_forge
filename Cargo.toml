[workspace]
members = ["crates/qr_forge_core", "crates/qr_forge_web"]
resolver = "3"

[workspace.package]
description = "Privacy-first QR code and barcode generation for browsers and Rust"
edition = "2024"
homepage = "https://github.com/Tinkora/qr_forge"
license = "MIT"
repository = "https://github.com/Tinkora/qr_forge"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
qrcode = "0.14"
barcoders = { version = "=2.0.0", default-features = false, features = ["std"] }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
console_error_panic_hook = "0.1"
rxing = { version = "=0.9.2", default-features = false, features = ["decoders", "encoding_rs", "oned", "qrcode"] }

[profile.release]
lto = "thin"
strip = true
