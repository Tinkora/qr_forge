name: Quality

'on':
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    uses: Tinkora/.github/.github/workflows/reusable-rust-quality.yml@21145ce218263e3b30359bab0c748da4702f801b # Tinkora workflow bundle
    with:
      working-directory: .
      toolchain: 1.85.0
      locked: true
      msrv: 1.85.0
      coverage: true

  wasm:
    uses: Tinkora/.github/.github/workflows/reusable-wasm-quality.yml@21145ce218263e3b30359bab0c748da4702f801b # Tinkora workflow bundle
    with:
      working-directory: crates/qr_forge_web
      toolchain: 1.85.0
      locked: true
      playwright-smoke: true
      node-version: '24'

  package-contents:
    name: Cargo package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject generated package content
        shell: bash
        run: |
          set -euo pipefail
          for package in qr_forge_core qr_forge_web; do
            package_list="$RUNNER_TEMP/${package}-package.txt"
            cargo package --locked -p "$package" --list > "$package_list"
            if grep -Eq '^(node_modules|pkg|playwright-report|static/pkg|test-results)(/|$)' "$package_list"; then
              echo "generated content entered ${package}:" >&2
              grep -E '^(node_modules|pkg|playwright-report|static/pkg|test-results)(/|$)' "$package_list" >&2
              exit 1
            fi
          done
